[plugin]

name="No Middle Paste"
description="Switches off middle-mouse-button pasting in every text field of the editor, so a mouse whose wheel fires the middle button while scrolling cannot paste over a script. Sets TextEdit.middle_mouse_paste_enabled and LineEdit.middle_mouse_paste_enabled to false on every text field, now and later."
author="Maurice"
version="1.0"
script="plugin.gd"
